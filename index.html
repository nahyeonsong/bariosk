<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="바리오스크" />
        <meta property="og:description" content="바리오스크 카페 메뉴" />
        <meta property="og:url" content="" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <title>바리오스크</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    </head>
    <body>
        <header>
            <div class="header-content">
                <div class="logo-container">
                    <h1>Bariosk</h1>
                </div>
                <div class="header-right">
                    <div class="cart-section">
                        <h2>장바구니</h2>
                        <div id="cartItems"></div>
                        <div class="cart-total">
                            <span>총 금액:</span>
                            <span id="totalAmount">0원</span>
                        </div>
                        <div class="cart-buttons">
                            <button
                                id="checkoutBtn"
                                class="checkout-btn"
                                disabled
                            >
                                이미지 다운로드
                            </button>
                            <button id="clearCartBtn" class="clear-cart-btn">
                                장바구니 비우기
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="menuContainer" id="menuContainer">
                <!-- 메뉴 섹션들이 여기에 동적으로 추가됩니다 -->
            </div>

            <div id="adminPanel" class="admin-panel" style="display: none">
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="menu">
                        메뉴 관리
                    </button>
                    <button class="tab-btn" data-tab="category">
                        카테고리 관리
                    </button>
                </div>

                <div id="menuTab" class="tab-content active">
                    <div class="menu-section">
                        <h2>메뉴 관리</h2>
                        <div class="menu-grid" id="menuGrid">
                            <!-- 메뉴 항목들이 여기에 동적으로 추가됩니다 -->
                        </div>
                    </div>

                    <form id="addMenuForm">
                        <div class="form-group">
                            <label for="category">카테고리</label>
                            <select id="category" name="category" required>
                                <!-- 카테고리 옵션들은 동적으로 생성될 것입니다 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="name">메뉴 이름</label>
                            <input type="text" id="name" name="name" required />
                        </div>
                        <div class="form-group">
                            <label for="temperature">온도</label>
                            <select id="temperature" name="temperature">
                                <option value="">선택 안함</option>
                                <option value="H">Hot</option>
                                <option value="I">Ice</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="price">가격</label>
                            <input
                                type="number"
                                id="price"
                                name="price"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="orderIndex">순서</label>
                            <input
                                type="number"
                                id="orderIndex"
                                name="orderIndex"
                                min="1"
                                placeholder="자동 설정"
                            />
                            <small>비워두면 자동으로 마지막 순서에 추가됩니다.</small>
                        </div>
                        <button type="submit">메뉴 추가</button>
                    </form>

                    <form id="editMenuForm" style="display: none">
                        <input type="hidden" name="menuId" id="editMenuId" />
                        <div class="form-group">
                            <label for="editCategory">카테고리</label>
                            <select id="editCategory" name="category" required>
                                <!-- 카테고리 옵션들은 동적으로 생성될 것입니다 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editName">메뉴 이름</label>
                            <input type="text" id="editName" name="name" required />
                        </div>
                        <div class="form-group">
                            <label for="editTemperature">온도</label>
                            <select id="editTemperature" name="temperature">
                                <option value="">선택 안함</option>
                                <option value="H">Hot</option>
                                <option value="I">Ice</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editPrice">가격</label>
                            <input type="number" id="editPrice" name="price" required />
                        </div>
                        <div class="form-group">
                            <label for="editOrderIndex">순서</label>
                            <input
                                type="number"
                                id="editOrderIndex"
                                name="orderIndex"
                                min="1"
                            />
                        </div>
                        <button type="submit">메뉴 수정</button>
                        <button type="button" id="cancelEdit">취소</button>
                    </form>
                </div>

                <div id="categoryTab" class="tab-content">
                    <div class="category-section">
                        <h2>카테고리 관리</h2>
                        <div class="category-list" id="categoryList">
                            <!-- 카테고리 목록이 여기에 동적으로 추가됩니다 -->
                        </div>
                    </div>

                    <form id="addCategoryForm">
                        <div class="form-group">
                            <label for="categoryName">새 카테고리 이름</label>
                            <input type="text" id="categoryName" name="name" required />
                        </div>
                        <button type="submit">카테고리 추가</button>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p>&copy; 2024 Bariosk. All rights reserved.</p>
                <button id="adminToggle" class="admin-toggle">
                    관리자 모드
                </button>
            </div>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
